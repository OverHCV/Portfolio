<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF00FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="128" height="128" rx="28" fill="#0a0a0f"/>
  
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  
  <text x="64" y="82" font-family="system-ui, sans-serif" font-size="56" font-weight="bold" text-anchor="middle" fill="url(#grad)" filter="url(#glow)">CD</text>
</svg>
